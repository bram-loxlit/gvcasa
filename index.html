<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GV CASA - A New Chapter</title>
    <style>
        :root {
            --brand-green: #0d8a31;
            --text-color: #333333;
            --bg-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
        }

        /* Main content container */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            margin-top: -10vh; /* Shift up slightly to balance the footer */
        }

        .main-text {
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
            font-weight: 400;
        }

        /* Button styled as outline */
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            color: var(--text-color);
            text-decoration: none;
            padding: 0.6rem 1.8rem;
            border: 1px solid var(--text-color);
            border-radius: 2rem;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .button:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .button .arrow {
            margin-left: 0.5rem;
            font-size: 1.2em;
        }

        /* Footer styling */
        .footer {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-top: auto;
        }

        .copyright {
            position: absolute;
            left: 2rem;
            bottom: calc(100% + 1rem); /* Positioned just above the logo */
            font-size: 0.65rem;
            color: #666;
            letter-spacing: 0.02em;
            z-index: 10;
        }

        /* SVG Wordmark full bleed */
        .wordmark-container {
            width: 100%;
            line-height: 0;
            display: block;
        }

        .wordmark-container svg {
            display: block;
            width: 100%;
            height: auto;
            fill: var(--brand-green);
            margin-bottom: -10px; /* prevents tiny white gap between svg and the solid bar */
        }

        .green-footer-bar {
            width: 100%;
            height: 12vh; /* Solid green block extending to bottom */
            background-color: var(--brand-green);
        }

        @media (max-width: 768px) {
            .main-text {
                font-size: 1rem;
            }
            .copyright {
                left: 1rem;
                bottom: calc(100% + 0.5rem);
            }
            .button {
                padding: 0.75rem 1.5rem; /* slightly larger tap target on mobile */
            }
            .green-footer-bar {
                height: 8vh;
            }
        }
    </style>
</head>

        <div class="main-text">
            A new chapter by invitation only.<br>
            Register your interest to receive notification<br>
            for upcoming private access and bespoke releases.
        </div>
        
        <!-- Mailto link for functionality -->
        <a href="mailto:info@gvcasa.com" class="button">
            Request invitation <span class="arrow">&rarr;</span>
        </a>
    </main>
